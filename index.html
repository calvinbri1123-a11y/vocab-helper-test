<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>語詞助手｜測試版 2</title>
<style>
:root{--g:#35684f;--p:#edf4ef;--l:#d5e1d8;--ink:#203027}*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header,main{max-width:850px;margin:auto}header{padding:22px 16px 8px}h1{font-size:25px}h2{font-size:18px;margin:0 0 12px}p{line-height:1.6}.note{font-size:13px;color:#5e6d63;line-height:1.6}main{padding:8px 14px 30px}.panel{background:#fff;border:1px solid var(--l);border-radius:16px;padding:16px;margin:12px 0}label{display:block;font-weight:650;margin:12px 0 6px}input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #c8d5cc;border-radius:10px;background:#fbfdfb}textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,.button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;text-align:center;text-decoration:none;display:inline-block}.primary{background:var(--g);color:white;width:100%;margin-top:12px}.secondary{background:var(--p);color:var(--g);border:1px solid var(--l)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{display:none;background:#f5f8f5;padding:10px;border-radius:10px;margin-top:10px}.wordlist{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));border-top:1px solid #777;margin-top:10px}.word{border:1px solid #777;border-top:0;border-right:0;padding:12px 9px;min-height:46px;overflow-wrap:anywhere}.word:nth-child(even){border-right:1px solid #777}@media(max-width:520px){.row{grid-template-columns:1fr}}@media print{@page{size:A4 portrait;margin:12mm}body{background:#fff;color:#000}header,.no-print,.panel:not(.print-panel){display:none!important}main{max-width:none;padding:0}.print-panel{border:0;padding:0;margin:0}#printTitle{display:block!important;text-align:center;font-size:18pt;font-weight:bold;margin-bottom:6mm}#printMeta{display:block!important;text-align:center;font-size:10pt;margin-bottom:5mm}.word{min-height:15mm;padding:4mm 3mm;font-size:14pt;break-inside:avoid}}
</style></head><body>
<header><div class="note">IPHONE FRIENDLY · 免費測試版 2</div><h1>語詞助手</h1><p class="note">選擇課程，複製整理指令到 ChatGPT；整理完成後將語詞貼回本頁，即可去重、預覽及列印／存成 PDF。</p></header>
<main>
<section class="panel no-print"><h2>① 選擇課程</h2><div class="row"><div><label>出版社／版本</label><select id="edition"><option value="">請選出版社</option><option>康軒</option><option>翰林</option><option>南一</option></select></div><div><label>年級</label><select id="grade"><option value="">請選年級</option><option>七年級</option><option>八年級</option><option>九年級</option></select></div></div><div class="row"><div><label>學期</label><select id="semester"><option value="">請選學期</option><option>上學期</option><option>下學期</option></select></div><div><label>課次與課名</label><select id="lesson"><option value="">請先選出版社、年級與學期</option></select></div></div><label>其他課次／課名（選填）</label><input id="customLesson" placeholder="若選單沒有該課，請在這裡輸入"><label>課文內容（選填）</label><textarea id="sourceText" placeholder="可貼上課文；沒有課文時，指令會要求 ChatGPT 先搜尋公開資料並說明來源限制。"></textarea><div class="actions"><button class="secondary" id="copyPrompt">複製整理指令</button><a class="button secondary" href="https://chatgpt.com/" target="_blank" rel="noopener">開啟 ChatGPT</a></div><button class="primary" id="goChat">複製指令並開啟 ChatGPT</button><div class="status" id="status"></div><p class="note">網頁無法代替你按下 ChatGPT 的送出鍵。按鈕會複製完整指令並開啟 ChatGPT，請貼上後送出。</p></section>
<section class="panel no-print"><h2>② 貼上整理結果</h2><p class="note">支援頓號分隔，或每行一筆；若每行格式是「詞語｜注音｜類別｜核對狀態」，會取第一欄作為語詞。</p><label>語詞清單</label><textarea id="words" placeholder="例如：傳記、寓言、諷刺、陝西省"></textarea><div class="row"><div><label>整理類別</label><select id="mode"><option>課本正式語詞</option><option>考試補充語詞</option><option>課本正式語詞＋考試補充語詞</option></select></div><div><label>列印欄數</label><select id="cols"><option value="1">1 欄</option><option value="2" selected>2 欄</option><option value="3">3 欄</option></select></div></div><label>列印標題</label><input id="title" placeholder="例如：國中國文七年級上學期第四課語詞"><div class="actions"><button class="primary" id="previewBtn" style="width:auto;margin:0">去除重複並預覽</button><button class="secondary" id="copyWords">複製去重後語詞</button><button class="secondary" id="clear">清空語詞</button></div></section>
<section class="panel print-panel"><div id="printTitle" style="display:none"></div><div id="printMeta" style="display:none"></div><div class="no-print"><h2>③ 預覽與列印</h2><p id="count" class="note">尚未整理語詞。</p><button class="primary" id="printBtn">列印／存成 PDF</button></div><div id="preview" class="wordlist" style="--cols:2"></div></section>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);const data={'康軒|七年級|上學期':['第一課 夏夜','第二課 生之歌選','第三課 鮭魚產卵，力爭上游','第四課 差不多先生']};
function update(){const key=[$('edition').value,$('grade').value,$('semester').value].join('|'),s=$('lesson');s.innerHTML='';if(data[key]){s.add(new Option('請選課次與課名',''));data[key].forEach(x=>s.add(new Option(x,x)))}else{s.add(new Option('此組合尚無核對課名，請自行輸入',''))}}
['edition','grade','semester'].forEach(id=>$(id).addEventListener('change',update));
function promptText(){return `請協助整理國中國文課程語詞。\n版本／出版社：${$('edition').value||'未指定'}\n年級：${$('grade').value||'未指定'}\n學期：${$('semester').value||'未指定'}\n課次與課名：${$('customLesson').value.trim()||$('lesson').value||'未指定'}\n\n規則：若有提供課文，以課文為主；若未提供，先搜尋公開課文、出版社資料、課程計畫或可信教學資料，不要先要求我上傳課文。只整理適合國中生學習的重點詞語，不要把所有連續字串都當成詞。分成「課本正式語詞」與「考試補充語詞」，去除重複，不為湊數加入不重要的詞。每個詞附注音，多音字依詞義判斷；無法確認標示待核對，不要猜。清楚區分已查證內容與補充推測。請用每行一筆的格式輸出：詞語｜注音｜類別｜核對狀態，不要輸出程式碼。\n\n課文內容：\n${$('sourceText').value.trim()||'未提供，請先依公開資料搜尋；若無法查證請明確說明，不要杜撰。'}`;}
function status(t){$('status').textContent=t;$('status').style.display='block'}
async function copyPrompt(){const t=promptText();try{await navigator.clipboard.writeText(t);status('整理指令已複製，請切換到 ChatGPT 貼上並送出。')}catch(e){window.prompt('請複製以下整理指令，再貼到 ChatGPT',t)}}
$('copyPrompt').onclick=copyPrompt;$('goChat').onclick=async()=>{await copyPrompt();window.open('https://chatgpt.com/','_blank','noopener')};
function words(){let lines=$('words').value.trim().split(/\r?\n/).filter(Boolean),a=[];lines.forEach(l=>{if(/[｜|]/.test(l))a.push(l.split(/[｜|]/)[0].trim());else a.push(...l.split(/[、，,；;\t]+/).map(x=>x.trim()).filter(Boolean))});let seen=new Set();return a.map(w=>w.replace(/^[-*•\d.、)）\s]+/,'').trim()).filter(w=>{if(!w||/^(詞語|語詞|注音|類別)$/.test(w)||seen.has(w))return false;seen.add(w);return true})}
function render(){const a=words(),b=$('preview');b.innerHTML='';b.style.setProperty('--cols',$('cols').value);$('count').textContent=a.length?`共 ${a.length} 個不重複語詞｜${$('mode').value}`:'尚未整理語詞，請先貼上清單。';$('printTitle').textContent=$('title').value.trim()||'國中國文語詞';$('printMeta').textContent=`共 ${a.length} 個語詞｜${$('mode').value}`;a.forEach(w=>{let d=document.createElement('div');d.className='word';d.textContent=w;b.appendChild(d)})}
$('previewBtn').onclick=render;$('printBtn').onclick=()=>{render();window.print()};$('copyWords').onclick=async()=>{let t=words().join('、');if(!t){alert('目前沒有可複製的語詞');return}try{await navigator.clipboard.writeText(t);status('去重後語詞已複製。')}catch(e){window.prompt('請複製語詞',t)}};$('clear').onclick=()=>{$('words').value='';render()};update()})();
</script></body></html>
